<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客服平台后台</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f6f7fb;color:#172033}.login{min-height:100vh;display:grid;place-items:center}.card{background:#fff;border:1px solid #e9ecf2;border-radius:18px;box-shadow:0 12px 40px #17203312}.login .card{width:min(420px,92vw);padding:32px}.login h1{margin:0 0 8px}.muted{color:#6b7280}.input{width:100%;padding:12px 13px;border:1px solid #dce1ea;border-radius:10px;margin:7px 0 14px;font-size:15px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#111827;color:#fff;cursor:pointer}.btn.secondary{background:#eef1f6;color:#263244}.app{display:none;min-height:100vh}.side{width:240px;background:#111827;color:#fff;padding:20px;position:fixed;inset:0 auto 0 0}.brand{font-size:19px;font-weight:700;margin-bottom:24px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:11px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#273244;color:#fff}.main{margin-left:240px;padding:28px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stat{padding:20px}.stat b{display:block;font-size:28px;margin-top:8px}.panel{margin-top:18px;padding:20px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.table{width:100%;border-collapse:collapse;margin-top:15px}.table th,.table td{padding:12px;border-bottom:1px solid #edf0f4;text-align:left}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:12px}.hidden{display:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.modal{position:fixed;inset:0;background:#0006;display:none;place-items:center;padding:20px}.modal .card{width:min(560px,95vw);padding:24px}@media(max-width:900px){.side{position:static;width:auto}.main{margin:0}.app{display:block}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body>
<div id="login" class="login"><div class="card"><h1>客服平台</h1><p class="muted">多商家 · 聊天插件 · 自动化 · 客服小组</p><form id="loginForm"><label>总管理员邮箱</label><input class="input" id="email" value="admin@demo.local"><label>密码</label><input class="input" id="password" type="password" value="admin123"><button class="btn" style="width:100%">登录后台</button></form><p class="muted" style="font-size:12px;margin-top:14px">演示账号：admin@demo.local / admin123</p></div></div>
<div id="app" class="app"><aside class="side"><div class="brand">客服平台后台</div><div id="tenantName" class="muted" style="margin-bottom:18px"></div><div class="nav"><button data-page="dashboard" class="active">📊 总览</button><button data-page="plugins">💬 聊天插件</button><button data-page="automations">🤖 自动化</button><button data-page="groups">👥 客服小组</button><button data-page="shortcuts">⚡ 快捷入口</button><button data-page="channels">🌐 官方渠道</button><button data-page="settings">⚙️ 设置</button></div><button id="logout" class="btn secondary" style="width:100%;margin-top:25px">退出</button></aside><main class="main"><div class="top"><div><h1 id="pageTitle" style="margin:0">总览</h1><div class="muted" id="pageSub">管理你的聊天插件和业务线路</div></div></div><section id="content"></section></main></div>
<div id="modal" class="modal"><div class="card"><div class="row"><h2 id="modalTitle">新增</h2><button class="btn secondary" onclick="closeModal()">关闭</button></div><div id="modalBody"></div></div></div>
<script>
const $=s=>document.querySelector(s); let current='dashboard', cache={};
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||'请求失败');return d}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});showApp()}catch(x){alert(x.message)}};
$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.page;render()});
async function showApp(){try{const me=await api('/api/me');$('#tenantName').textContent=me.tenant.name+' · '+me.user.name;$('#login').style.display='none';$('#app').style.display='block';render()}catch(e){}}
function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').style.display='grid'} function closeModal(){$('#modal').style.display='none'}
async function render(){const c=$('#content');const titles={dashboard:['总览','管理你的聊天插件和业务线路'],plugins:['聊天插件','每个插件可以绑定独立自动化与客服小组'],automations:['AI 自动化','创建并管理每条业务线路的自动化流程'],groups:['客服小组','每条业务线路可以拥有独立客服组'],shortcuts:['快捷入口','平台生成入口链接，并绑定到指定插件与自动化'],channels:['官方渠道','后续在这里接入 WhatsApp、Messenger、Instagram、Telegram、Email、YouTube'],settings:['设置','平台与商家基础设置']};$('#pageTitle').textContent=titles[current][0];$('#pageSub').textContent=titles[current][1];if(current==='dashboard')return dashboard(c);if(current==='channels')return channels(c);if(current==='settings')return settings(c);return listPage(c,current)}
async function dashboard(c){const d=await api('/api/dashboard');c.innerHTML=`<div class="grid">${[['聊天插件',d.plugins,'plugins'],['自动化',d.automations,'automations'],['客服小组',d.groups,'groups'],['快捷入口',d.shortcuts,'shortcuts']].map(x=>`<div class="card stat"><div class="muted">${x[0]}</div><b>${x[1]}</b><button class="btn secondary" style="margin-top:10px" onclick="go('${x[2]}')">管理</button></div>`).join('')}</div><div class="card panel"><h2>核心路由</h2><p class="muted">快捷入口 → 聊天插件 → 对应自动化 → 对应客服小组 → 客服。</p><div class="two"><div><span class="pill">EE11</span><p>EE11 → EE11 自动化 → EE11 客服组</p></div><div><span class="pill">66GG</span><p>66GG → 66GG 自动化 → 66GG 客服组</p></div></div></div>`}
function go(p){document.querySelector(`[data-page="${p}"]`).click()}
async function listPage(c,type){const items=await api('/api/'+type);cache[type]=items;const names={plugins:['聊天插件','插件名称','+ 创建插件'],automations:['自动化','自动化名称','+ 创建自动化'],groups:['客服小组','小组名称','+ 创建客服组'],shortcuts:['快捷入口','入口名称','+ 创建快捷入口']};const n=names[type];let rows='';if(type==='plugins')rows=items.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.status}</td><td>${x.automationId||'未绑定'}</td><td>${x.groupId||'未绑定'}</td></tr>`).join('');if(type==='automations')rows=items.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.description||''}</td><td>${x.status}</td></tr>`).join('');if(type==='groups')rows=items.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.members.length} 人</td><td>${x.status}</td></tr>`).join('');if(type==='shortcuts')rows=items.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.pluginId}</td><td>${x.automationId}</td><td><code>${location.origin}/go/${x.slug}</code></td></tr>`).join('');c.innerHTML=`<div class="card panel" style="margin-top:0"><div class="row"><div><h2 style="margin:0">${n[0]}</h2><p class="muted">${type==='plugins'?'一个插件就是一条独立业务线路。':''}</p></div><button class="btn" onclick="openCreate('${type}')">${n[2]}</button></div><table class="table"><thead><tr>${type==='plugins'?'<th>名称</th><th>状态</th><th>自动化</th><th>客服组</th>':type==='automations'?'<th>名称</th><th>说明</th><th>状态</th>':type==='groups'?'<th>名称</th><th>成员</th><th>状态</th>':'<th>名称</th><th>插件</th><th>自动化</th><th>平台链接</th>'}</tr></thead><tbody>${rows||'<tr><td colspan="5" class="muted">暂无数据</td></tr>'}</tbody></table></div>`}
function openCreate(type){if(type==='plugins')return modal('创建聊天插件',`<form onsubmit="createItem(event,'plugins')"><label>插件名称</label><input class="input" id="fName" placeholder="例如 EE11" required><label>绑定自动化</label><select class="input" id="fAuto"><option value="">暂不绑定</option>${(cache.automations||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><label>绑定客服小组</label><select class="input" id="fGroup"><option value="">暂不绑定</option>${(cache.groups||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><button class="btn">创建</button></form>`);if(type==='automations')return modal('创建自动化',`<form onsubmit="createItem(event,'automations')"><label>名称</label><input class="input" id="fName" placeholder="例如 EE11 自动化" required><label>说明</label><textarea class="input" id="fDesc" placeholder="AI 判断 → 标签 → 客服分配"></textarea><button class="btn">创建</button></form>`);if(type==='groups')return modal('创建客服小组',`<form onsubmit="createItem(event,'groups')"><label>小组名称</label><input class="input" id="fName" placeholder="例如 EE11 客服组" required><button class="btn">创建</button></form>`);return modal('创建快捷入口',`<form onsubmit="createItem(event,'shortcuts')"><label>入口名称</label><input class="input" id="fName" placeholder="例如 EE11 联系客服" required><label>所属聊天插件</label><select class="input" id="fPlugin" required>${(cache.plugins||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><label>进入自动化</label><select class="input" id="fAuto" required>${(cache.automations||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><button class="btn">生成平台链接</button></form>`)}
async function createItem(e,type){e.preventDefault();const b={name:$('#fName').value};if(type==='plugins'){b.automationId=$('#fAuto').value||null;b.groupId=$('#fGroup').value||null}if(type==='automations')b.description=$('#fDesc').value;if(type==='shortcuts'){b.pluginId=$('#fPlugin').value;b.automationId=$('#fAuto').value}try{const x=await api('/api/'+type,{method:'POST',body:JSON.stringify(b)});closeModal();if(type==='shortcuts')alert('已生成平台入口：'+location.origin+'/go/'+x.slug);render()}catch(err){alert(err.message)}}
function channels(c){c.innerHTML=`<div class="grid">${['WhatsApp App','WhatsApp API','Facebook Messenger','Instagram','Telegram App','Telegram Bot','Email','YouTube 评论'].map(x=>`<div class="card panel"><h3>${x}</h3><p class="muted">待接入官方 API / OAuth</p><button class="btn secondary" disabled>配置（下一阶段）</button></div>`).join('')}</div>`}
function settings(c){c.innerHTML=`<div class="card panel"><h2>当前版本</h2><p>v0.1 · 多商家客服平台基础后台</p><p class="muted">当前已实现：总管理员登录、插件/自动化/客服组/快捷入口管理、平台入口生成、基础路由验证。</p></div>`}
showApp();
</script></body></html>
