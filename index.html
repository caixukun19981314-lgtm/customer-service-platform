<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搭建客服后台</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#172033}.login{min-height:100vh;display:grid;place-items:center}.card{background:#fff;border:1px solid #e7ebf2;border-radius:16px;box-shadow:0 10px 35px #17203312}.login .card{width:min(420px,92vw);padding:32px}.input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d9dee8;border-radius:9px;margin:7px 0 14px;font-size:14px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#1d4ed8;color:#fff;cursor:pointer}.btn.secondary{background:#eef1f6;color:#253044}.app{display:none;min-height:100vh}.side{width:240px;background:#101827;color:#fff;padding:20px;position:fixed;inset:0 auto 0 0}.brand{font-size:20px;font-weight:700;margin-bottom:24px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:11px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#263246;color:#fff}.main{margin-left:240px;padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stat{padding:20px}.stat b{display:block;font-size:28px;margin-top:8px}.panel{padding:20px;margin-top:18px}.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{padding:13px;border-bottom:1px solid #edf0f4;text-align:left}.clickable{cursor:pointer}.clickable:hover{background:#f8fafc}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#334155;font-size:12px}.role-super{background:#fff7ed;color:#c2410c}.role-agent{background:#eff6ff;color:#1d4ed8}.modal{position:fixed;inset:0;background:#0006;display:none;place-items:center;padding:20px;z-index:20}.modal .card{width:min(580px,95vw);padding:24px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.empty{padding:30px;text-align:center;color:#8a94a6}.back{margin-bottom:14px}@media(max-width:900px){.side{position:static;width:auto}.main{margin:0}.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.two{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login"><div class="card"><h1>搭建客服后台</h1><p class="muted">多商家 · 聊天插件 · AI 自动化 · 客服小组</p><form id="loginForm"><label>总管理员邮箱</label><input class="input" id="email" value="admin@demo.local" required><label>密码</label><input class="input" id="password" type="password" value="admin123" required><button class="btn" style="width:100%">登录后台</button></form><p class="muted" style="font-size:12px">演示账号：admin@demo.local / admin123</p></div></div>
<div id="app" class="app"><aside class="side"><div class="brand">搭建客服</div><div id="tenantName" class="muted" style="margin-bottom:18px"></div><div class="nav"><button data-page="dashboard" class="active">▦　总览</button><button data-page="plugins">◉　聊天插件</button><button data-page="automations">✦　AI 自动化</button><button data-page="groups">♟　客服小组</button><button data-page="shortcuts">↗　快捷入口</button><button data-page="channels">◎　官方渠道</button><button data-page="settings">⚙　设置</button></div><button id="logout" class="btn secondary" style="width:100%;margin-top:25px">退出登录</button></aside><main class="main"><div class="top"><div><h1 id="pageTitle" style="margin:0">总览</h1><div id="pageSub" class="muted">管理你的客服业务线路</div></div></div><section id="content"></section></main></div>
<div id="modal" class="modal"><div class="card"><div class="row"><h2 id="modalTitle" style="margin:0 0 14px">新增</h2><button class="btn secondary" onclick="closeModal()">关闭</button></div><div id="modalBody"></div></div></div>
<script>
const $=s=>document.querySelector(s);let current='dashboard',cache={};
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||'请求失败');return d}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});showApp()}catch(x){alert(x.message)}};
$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.page;render()});
async function showApp(){try{const me=await api('/api/me');$('#tenantName').textContent=me.tenant.name+' · '+me.user.name;$('#login').style.display='none';$('#app').style.display='block';render()}catch(e){}}
function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').style.display='grid'}function closeModal(){$('#modal').style.display='none'}function go(p){document.querySelector(`[data-page="${p}"]`).click()}
async function render(){const titles={dashboard:['总览','管理你的聊天插件和业务线路'],plugins:['聊天插件','每个插件可以绑定独立自动化与客服小组'],automations:['AI 自动化','创建并管理每条业务线路的自动化流程'],groups:['客服小组','先创建团队，再在团队里面创建客服账号和角色权限'],shortcuts:['快捷入口','平台自动生成入口链接'],channels:['官方渠道','WhatsApp、Messenger、Instagram、Telegram、Email、YouTube 等渠道'],settings:['设置','平台与商家基础设置']};$('#pageTitle').textContent=titles[current][0];$('#pageSub').textContent=titles[current][1];if(current==='dashboard')return dashboard();if(current==='channels')return channels();if(current==='settings')return settings();return listPage(current)}
async function dashboard(){const d=await api('/api/dashboard');$('#content').innerHTML=`<div class="grid">${[['聊天插件',d.plugins,'plugins'],['AI 自动化',d.automations,'automations'],['客服小组',d.groups,'groups'],['快捷入口',d.shortcuts,'shortcuts']].map(x=>`<div class="card stat"><div class="muted">${x[0]}</div><b>${x[1]}</b><button class="btn secondary" style="margin-top:10px" onclick="go('${x[2]}')">管理</button></div>`).join('')}</div><div class="card panel"><h2>业务路由</h2><p class="muted">会员快捷入口 → AI 自动化 → 客服小组 → 客服账号。</p><div class="two"><div><span class="pill">EE11</span><p>EE11 → EE11 自动化 → EE11 客服组</p></div><div><span class="pill">66GG</span><p>66GG → 66GG 自动化 → 66GG 客服组</p></div></div></div>`}
async function listPage(type){const c=$('#content');if(type==='groups')return groupsPage(c);const items=await api('/api/'+type);cache[type]=items;const meta={plugins:['聊天插件','+ 创建插件'],automations:['AI 自动化','+ 创建自动化'],shortcuts:['快捷入口','+ 创建快捷入口']}[type];let rows='';if(type==='plugins')rows=items.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.status}</td><td>${x.automationId||'未绑定'}</td><td>${x.groupId||'未绑定'}</td></tr>`).join('');if(type==='automations')rows=items.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.description||''}</td><td>${x.status}</td></tr>`).join('');if(type==='shortcuts')rows=items.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.pluginId}</td><td>${x.automationId}</td><td><code>${location.origin}/go/${x.slug}</code></td></tr>`).join('');const head=type==='plugins'?'<th>名称</th><th>状态</th><th>自动化</th><th>客服组</th>':type==='automations'?'<th>名称</th><th>说明</th><th>状态</th>':'<th>名称</th><th>插件</th><th>自动化</th><th>平台链接</th>';c.innerHTML=`<div class="card panel" style="margin-top:0"><div class="row"><h2 style="margin:0">${meta[0]}</h2><button class="btn" onclick="openCreate('${type}')">${meta[1]}</button></div><table class="table"><thead><tr>${head}</tr></thead><tbody>${rows||`<tr><td colspan="5" class="empty">暂无数据</td></tr>`}</tbody></table></div>`}
async function groupsPage(c){const [groups,accounts]=await Promise.all([api('/api/groups'),api('/api/customer-accounts')]);cache.groups=groups;cache.accounts=accounts;c.innerHTML=`<div class="card panel" style="margin-top:0"><div class="row"><div><h2 style="margin:0">客服小组</h2><p class="muted">先创建团队，再进入团队创建客服账号。</p></div><button class="btn" onclick="openCreate('groups')">＋ 创建团队</button></div><table class="table"><thead><tr><th>团队名称</th><th>成员</th><th>状态</th><th>操作</th></tr></thead><tbody>${groups.map(g=>{const n=accounts.filter(a=>a.teamId===g.id).length;return `<tr class="clickable" onclick="openGroup('${g.id}')"><td><b>${g.name}</b></td><td>${n} 人</td><td><span class="pill">● 正常</span></td><td><button class="btn secondary" onclick="event.stopPropagation();openGroup('${g.id}')">管理团队</button></td></tr>`}).join('')||'<tr><td colspan="4" class="empty">暂无团队</td></tr>'}</tbody></table></div>`}
function openGroup(id){const g=cache.groups.find(x=>x.id===id);if(!g)return;const accounts=cache.accounts.filter(x=>x.teamId===id);$('#pageTitle').textContent=g.name;$('#pageSub').textContent='团队成员与角色权限';$('#content').innerHTML=`<button class="btn secondary back" onclick="go('groups')">← 返回客服小组</button><div class="card panel" style="margin-top:0"><div class="row"><div><h2 style="margin:0">${g.name}</h2><p class="muted">主管和客服是独立角色权限，不是备注。</p></div><button class="btn" onclick="openAccountCreate('${g.id}')">＋ 添加客服账号</button></div><table class="table"><thead><tr><th>昵称</th><th>邮箱</th><th>角色权限</th><th>状态</th></tr></thead><tbody>${accounts.map(a=>`<tr><td><b>${a.name}</b></td><td>${a.email}</td><td><span class="pill ${a.role==='主管'?'role-super':'role-agent'}">${a.role}</span></td><td>${a.status==='active'?'● 正常':'● 停用'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">这个团队还没有客服账号</td></tr>'}</tbody></table></div>`}
function openAccountCreate(teamId){modal('创建客服账号',`<form onsubmit="createAccount(event,'${teamId}')"><label>客服昵称</label><input class="input" id="aName" placeholder="例如 66GG001" required><label>登录邮箱</label><input class="input" id="aEmail" type="email" placeholder="agent@example.com" required><label>登录密码</label><input class="input" id="aPassword" type="password" placeholder="设置登录密码" required><label>角色权限</label><select class="input" id="aRole"><option value="主管">主管</option><option value="客服" selected>客服</option></select><p class="muted" style="font-size:12px">主管与客服是不同权限角色；创建后账号自动归属当前团队。</p><button class="btn">创建客服账号</button></form>`)}
async function createAccount(e,teamId){e.preventDefault();try{await api('/api/customer-accounts',{method:'POST',body:JSON.stringify({teamId,name:$('#aName').value,email:$('#aEmail').value,password:$('#aPassword').value,role:$('#aRole').value})});closeModal();const [g,a]=await Promise.all([api('/api/groups'),api('/api/customer-accounts')]);cache.groups=g;cache.accounts=a;openGroup(teamId)}catch(err){alert(err.message)}}
function openCreate(type){if(type==='groups')return modal('创建客服团队',`<form onsubmit="createItem(event,'groups')"><label>团队名称</label><input class="input" id="fName" placeholder="例如 EE11 客服组" required><button class="btn">创建团队</button></form>`);if(type==='plugins')return modal('创建聊天插件',`<form onsubmit="createItem(event,'plugins')"><label>插件名称</label><input class="input" id="fName" placeholder="例如 EE11" required><label>绑定自动化</label><select class="input" id="fAuto"><option value="">暂不绑定</option>${(cache.automations||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><label>绑定客服小组</label><select class="input" id="fGroup"><option value="">暂不绑定</option>${(cache.groups||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><button class="btn">创建插件</button></form>`);if(type==='automations')return modal('创建 AI 自动化',`<form onsubmit="createItem(event,'automations')"><label>名称</label><input class="input" id="fName" placeholder="例如 EE11 自动化" required><label>说明</label><textarea class="input" id="fDesc" placeholder="AI 判断 → 标签 → 客服分配"></textarea><button class="btn">创建自动化</button></form>`);return modal('创建快捷入口',`<form onsubmit="createItem(event,'shortcuts')"><label>入口名称</label><input class="input" id="fName" placeholder="例如 EE11 联系客服" required><label>聊天插件</label><select class="input" id="fPlugin" required>${(cache.plugins||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><label>AI 自动化</label><select class="input" id="fAuto" required>${(cache.automations||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><button class="btn">生成平台链接</button></form>`)}
async function createItem(e,type){e.preventDefault();const b={name:$('#fName').value};if(type==='plugins'){b.automationId=$('#fAuto').value||null;b.groupId=$('#fGroup').value||null}if(type==='automations')b.description=$('#fDesc').value;if(type==='shortcuts'){b.pluginId=$('#fPlugin').value;b.automationId=$('#fAuto').value}try{const x=await api('/api/'+type,{method:'POST',body:JSON.stringify(b)});closeModal();if(type==='shortcuts')alert('已生成平台入口：'+location.origin+'/go/'+x.slug);render()}catch(err){alert(err.message)}}
function channels(){const arr=['WhatsApp App','WhatsApp API','Facebook Messenger','Instagram','Telegram App','Telegram Bot','Email','YouTube 评论'];$('#content').innerHTML=`<div class="grid">${arr.map(x=>`<div class="card panel"><h3>${x}</h3><p class="muted">待接入官方 API / OAuth</p><button class="btn secondary" disabled>下一阶段配置</button></div>`).join('')}</div>`}function settings(){$('#content').innerHTML='<div class="card panel"><h2>当前版本</h2><p>团队 → 客服账号 → 角色权限基础版</p><p class="muted">主管和客服为独立角色；团队可单独管理成员。</p></div>'}
showApp();
</script></body></html>
